[project]
name = "server"
version = "0.1.0"
description = "this is a nlp project in which we are building an agent for helping research scholars in finding research papers"
readme = "README.md"
authors = [
    { name = "rakesh khokhar", email = "rakeshkhokhar00000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.32.0",
    "cloudinary>=1.46.3",
    "fastapi>=0.143.1",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=2.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: End-to-end integration tests requiring external live services and explicit opt-in",
]

